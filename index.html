<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout Tracker">
  <title>Mein Trainingsplan</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { margin: 0; font-size: 1.4rem; color: var(--accent); }
    header p { margin: 4px 0 0; font-size: 0.85rem; color: var(--text-muted); }

    .nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .nav button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .nav button.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: var(--accent);
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px 0;
      display: flex;
      justify-content: space-between;
    }
    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 45px 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .set-row span { font-size: 0.8rem; color: var(--text-muted); }
    .set-row input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
    }

    .btn-save {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-save:active { background: var(--accent-hover); }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #000;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <header>
    <h1>Trainings-Tracker</h1>
    <p>Allach Homegym & Ausdauer</p>
  </header>

  <div class="nav" id="day-nav"></div>
  <div id="exercise-list"></div>
  <button class="btn-save" id="save-btn" onclick="saveDay()">Trainingseinheit speichern</button>
  <div class="toast" id="toast">Erfolgreich gespeichert! ✓</div>

  <script>
    const plan = {
      di: {
        name: "Dienstag: Oberkörper",
        desc: "Rücken, Brust & Schultern",
        exercises: [
          { name: "Klimmzüge am Rack", target: "3–4 × 5–8", sets: 4 },
          { name: "Flachbankdrücken (LH/KH)", target: "3–4 × 6–8", sets: 4 },
          { name: "Enges Kabelrudern", target: "3 × 8–10", sets: 3 },
          { name: "Schulterdrücken (KH)", target: "3 × 8–10", sets: 3 },
          { name: "Facepulls (Kabelzug)", target: "3 × 12–15", sets: 3 },
          { name: "Arm-Supersatz: Trizeps & Curls", target: "2–3 × 10–12", sets: 3 }
        ]
      },
      do: {
        name: "Donnerstag: Unterkörper",
        desc: "Beine & Core",
        exercises: [
          { name: "Goblet Squats / Frontkniebeuge", target: "4 × 8–10 (Pause 90-120s)", sets: 4 },
          { name: "Rumänisches Kreuzheben (RDL)", target: "3–4 × 10–12 (Pause 90s)", sets: 4 },
          { name: "Split Squats (KH / TRX)", target: "3 × 8–10 je Bein (Pause 60s)", sets: 3 },
          { name: "Wadenheben (KH / Smith)", target: "3 × 12–15 (2s Pause oben)", sets: 3 },
          { name: "Hängendes Knie-/Beinheben", target: "3 × 10–12 (ohne Schwung)", sets: 3 }
        ]
      },
      sa: {
        name: "Samstag: Athletik & Hypertrophie",
        desc: "Ganzkörper & Ergänzung",
        exercises: [
          { name: "Kettlebell Swings", target: "3–4 × 15–20 (Pause 60s)", sets: 4 },
          { name: "TRX Fallouts / Pike", target: "3 × 10–12", sets: 3 },
          { name: "Schrägbankdrücken (KH / Bank 30-45°)", target: "3 × 8–10", sets: 3 },
          { name: "Butterfly am Kabelzug", target: "2–3 × 12–15", sets: 3 },
          { name: "Seitheben (Kabelzug / KH)", target: "3–4 × 12–15", sets: 4 },
          { name: "Woodchoppers (Kabelzug)", target: "3 × 12 je Seite", sets: 3 },
          { name: "Arm-Supersatz: Incline Curls & Trizeps", target: "Je 3 × 10–12", sets: 3 }
        ]
      },
      ausdauer: {
        name: "Ausdauer-Tage",
        desc: "Rolle / Ergometer",
        exercises: [
          { name: "Mittwoch: Locker kurbeln", target: "30–45 Min., Stufe 2-3/10 (ganze Sätze)", sets: 1 },
          { name: "Sonntag: VO2max Intervalle", target: "20m Einrollen + 4x(4m hart / 3m locker) + Ausfahren (90-120m)", sets: 1 }
        ]
      }
    };

    let activeDay = 'di';

    function init() {
      const nav = document.getElementById('day-nav');
      nav.innerHTML = Object.keys(plan).map(k => `
        <button class="${k === activeDay ? 'active' : ''}" onclick="switchDay('${k}')">
          ${plan[k].name.split(':')[0]}
        </button>
      `).join('');
      renderExercises();
    }

    function switchDay(key) {
      activeDay = key;
      init();
    }

    function renderExercises() {
      const container = document.getElementById('exercise-list');
      const data = plan[activeDay];
      const saved = JSON.parse(localStorage.getItem('workout_history') || '{}');
      
      let html = `<div style="margin-bottom:12px;"><strong>${data.name}</strong><br><small style="color:var(--text-muted)">${data.desc}</small></div>`;

      data.exercises.forEach((ex, exIdx) => {
        html += `<div class="card">
          <div class="card-title">${ex.name}</div>
          <div class="card-subtitle">Ziel: ${ex.target}</div>`;
        
        for (let s = 1; s <= ex.sets; s++) {
          const keyWeight = `${activeDay}_${exIdx}_s${s}_weight`;
          const keyReps = `${activeDay}_${exIdx}_s${s}_reps`;
          const valWeight = saved[keyWeight] || '';
          const valReps = saved[keyReps] || '';

          html += `
            <div class="set-row">
              <span>Satz ${s}</span>
              <input type="number" step="0.5" placeholder="kg" id="${keyWeight}" value="${valWeight}">
              <input type="number" placeholder="Wdh" id="${keyReps}" value="${valReps}">
              <span style="text-align:right;">✓</span>
            </div>
          `;
        }
        html += `</div>`;
      });

      container.innerHTML = html;
    }

    function saveDay() {
      const inputs = document.querySelectorAll('#exercise-list input');
      const saved = JSON.parse(localStorage.getItem('workout_history') || '{}');
      inputs.forEach(input => {
        saved[input.id] = input.value;
      });
      localStorage.setItem('workout_history', JSON.stringify(saved));
      
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    init();
  </script>
</body>
</html>
