<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout Tracker">
  <title>Mein Trainingsplan</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --card-inner: #0f172a;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 24px) 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header { text-align: center; margin-bottom: 16px; }
    header h1 { margin: 0; font-size: 1.35rem; color: var(--accent); }
    header p { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-muted); }

    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
      background: var(--card-inner);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .main-tabs button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .main-tabs button.active { background: var(--accent); color: #0b1120; }

    .nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .nav button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .nav button.active {
      background: var(--accent);
      color: #0b1120;
      font-weight: 600;
      border-color: var(--accent);
    }

    .date-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .date-box label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .date-box input[type="date"] {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
    }
    .date-label { font-size: 0.85rem; color: var(--accent); margin-top: 6px; font-weight: 600; }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .card-title { font-size: 0.95rem; font-weight: 600; margin: 0 0 2px 0; }
    .card-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .last-performance {
      font-size: 0.72rem;
      color: var(--accent);
      margin-bottom: 8px;
      background: rgba(56, 189, 248, 0.08);
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .set-row {
      display: grid;
      grid-template-columns: 46px 1fr 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .set-row span { font-size: 0.78rem; color: var(--text-muted); }
    .set-row input {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.88rem;
      text-align: center;
      width: 100%;
    }

    .plan-list { margin: 8px 0 0 0; padding-left: 18px; font-size: 0.85rem; line-height: 1.5; }
    .plan-list li { margin-bottom: 4px; }
    .done-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      cursor: pointer;
    }
    .done-box input { width: 26px; height: 26px; accent-color: var(--success); }
    .done-box span { font-size: 1rem; font-weight: 600; }

    .btn-action {
      background: var(--accent);
      color: #0b1120;
      font-weight: bold;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-action:active { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .history-entry { border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 12px; }
    .history-entry.endurance { border-left-color: var(--success); }
    .history-entry h4 { margin: 0 0 4px 0; font-size: 0.88rem; }
    .history-entry ul { margin: 0; padding-left: 16px; font-size: 0.78rem; color: var(--text-muted); }

    .chart-box {
      width: 100%;
      background: var(--card-inner);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      margin-top: 10px;
    }
    canvas { width: 100%; height: 220px; display: block; }

    select {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #0b1120;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: bold;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <header>
    <h1>Trainings-Tracker</h1>
    <p>Allach Homegym & Ausdauer</p>
  </header>

  <div class="main-tabs">
    <button id="tab-train" class="active" onclick="switchMainTab('train')">Training</button>
    <button id="tab-stats" onclick="switchMainTab('stats')">Fortschritt</button>
    <button id="tab-history" onclick="switchMainTab('history')">Verlauf</button>
  </div>

  <!-- TRAINING -->
  <div id="view-train">
    <div class="nav" id="day-nav"></div>
    <div class="date-box">
      <label for="session-date">Datum der Einheit</label>
      <input type="date" id="session-date" onchange="onDateChange()">
      <div class="date-label" id="date-label"></div>
    </div>
    <div id="exercise-list"></div>
    <button class="btn-action" id="save-btn" onclick="saveWorkoutSession()">Einheit speichern</button>
  </div>

  <!-- FORTSCHRITT -->
  <div id="view-stats" style="display:none;">
    <div class="card">
      <div class="card-title">Übungsfortschritt & 1RM</div>
      <div class="card-subtitle">Wähle eine Übung zur Visualisierung:</div>
      <select id="exercise-select" onchange="renderProgressChart()"></select>
      <div class="chart-box"><canvas id="progressChart"></canvas></div>
      <div id="stats-summary" style="margin-top:10px; font-size:0.8rem; color:var(--text-muted);"></div>
    </div>

    <div class="card">
      <div class="card-title">Daten-Backup & Sync</div>
      <div class="card-subtitle">Übertrage deine Einheiten zwischen iPhone und iPad:</div>
      <button class="btn-secondary" style="width:100%;" onclick="exportData()">Daten als Backup exportieren</button>
      <input type="file" id="importFile" style="display:none;" onchange="importData(event)">
      <button class="btn-secondary" style="width:100%; margin-top:6px;" onclick="document.getElementById('importFile').click()">Backup-Datei importieren</button>
    </div>
  </div>

  <!-- VERLAUF -->
  <div id="view-history" style="display:none;">
    <div class="card">
      <div class="card-title">Vergangene Einheiten</div>
      <div id="history-list" style="margin-top:10px;"></div>
    </div>
  </div>

  <div class="toast" id="toast">Gespeichert! ✓</div>

  <script>
    const plan = {
      di: {
        type: "strength",
        name: "Dienstag: Oberkörper",
        desc: "Rücken, Brust & Schultern",
        exercises: [
          { name: "Klimmzüge am Rack", target: "3–4 × 5–8", sets: 4 },
          { name: "Flachbankdrücken (LH/KH)", target: "3–4 × 6–8", sets: 4 },
          { name: "Enges Kabelrudern", target: "3 × 8–10", sets: 3 },
          { name: "Schulterdrücken (KH)", target: "3 × 8–10", sets: 3 },
          { name: "Facepulls (Kabelzug)", target: "3 × 12–15", sets: 3 },
          { name: "Trizepsdrücken am Kabel", target: "Optionaler Supersatz A · 2–3 × 10–12", sets: 3 },
          { name: "Stehende Kurzhantelcurls", target: "Optionaler Supersatz B · 2–3 × 10–12 · direkt nach A", sets: 3 }
        ]
      },
      mi: {
        type: "endurance",
        name: "Mittwoch: Lockere Ausdauer",
        desc: "Rollentrainer · 30–45 Min.",
        items: [
          "30–45 Minuten auf dem Rollentrainer",
          "Anstrengung 2–3 von 10: Sprechen in ganzen Sätzen muss problemlos möglich sein",
          "Keine Intervalle, keine schweren Gänge",
          "Bei müden Beinen lieber kürzen oder pausieren"
        ]
      },
      do: {
        type: "strength",
        name: "Donnerstag: Unterkörper",
        desc: "Beine & Core",
        exercises: [
          { name: "Goblet Squats / Frontkniebeuge", target: "4 × 8–10", sets: 4 },
          { name: "Rumänisches Kreuzheben (RDL)", target: "3–4 × 10–12", sets: 4 },
          { name: "Split Squats (KH / TRX)", target: "3 × 8–10 je Bein", sets: 3 },
          { name: "Wadenheben (KH / Smith)", target: "3 × 12–15", sets: 3 },
          { name: "Hängendes Knie-/Beinheben", target: "3 × 10–12", sets: 3 }
        ]
      },
      sa: {
        type: "strength",
        name: "Samstag: Athletik & Hypertrophie",
        desc: "Ganzkörper & Ergänzung",
        exercises: [
          { name: "Kettlebell Swings", target: "3–4 × 15–20", sets: 4 },
          { name: "TRX Fallouts / Pike", target: "3 × 10–12", sets: 3 },
          { name: "Schrägbankdrücken (KH / Bank 30-45°)", target: "3 × 8–10", sets: 3 },
          { name: "Butterfly am Kabelzug", target: "2–3 × 12–15", sets: 3 },
          { name: "Seitheben (Kabelzug / KH)", target: "3–4 × 12–15", sets: 4 },
          { name: "Woodchoppers (Kabelzug)", target: "3 × 12 je Seite", sets: 3 },
          { name: "Incline Dumbbell Curls", target: "Supersatz A · 3 × 10–12", sets: 3 },
          { name: "Überkopf-Trizepsdrücken am Kabel mit Seil", target: "Supersatz B · 3 × 10–12 · direkt nach A", sets: 3 }
        ]
      },
      so: {
        type: "endurance",
        name: "Sonntag: Lange Ausdauer",
        desc: "VO₂max-Intervalle · 90–120 Min.",
        items: [
          "Gesamtdauer: 90–120 Minuten auf der Rolle oder draußen",
          "1. Einrollen: 20–25 Minuten locker, Belastung allmählich steigern",
          "2. VO₂max-Block: 4 × 4 Minuten hart, aber kontrolliert und gleichmäßig; dazwischen je 3 Minuten sehr locker",
          "3. Lockere Weiterfahrt bis zur geplanten Gesamtdauer, die letzten Minuten besonders entspannt",
          "Bei unzureichender Erholung nur locker fahren oder die Einheit verkürzen"
        ]
      }
    };

    const STORAGE_KEY = 'workout_sessions_v2';
    let activeDay = 'di';
    let sessionDateIso = todayIso();

    function todayIso() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${d.getFullYear()}-${m}-${day}`;
    }

    function isoToDe(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}.${m}.${y}`;
    }

    function deToIso(de) {
      const p = (de || '').split('.');
      return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : '0000-00-00';
    }

    function sessionIso(s) {
      return s.iso || deToIso(s.date);
    }

    function weekdayLabel(iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString('de-DE', {
        weekday: 'long',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    function getHistory() {
      const h = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return h.sort((a, b) => {
        const c = sessionIso(b).localeCompare(sessionIso(a));
        return c !== 0 ? c : (b.id || 0) - (a.id || 0);
      });
    }

    function switchMainTab(tab) {
      ['train', 'stats', 'history'].forEach(t => {
        document.getElementById(`view-${t}`).style.display = (t === tab) ? 'block' : 'none';
        document.getElementById(`tab-${t}`).className = (t === tab) ? 'active' : '';
      });
      if (tab === 'stats') initStatsTab();
      if (tab === 'history') renderHistoryTab();
    }

    function initTrainNav() {
      const nav = document.getElementById('day-nav');
      nav.innerHTML = Object.keys(plan).map(k => `
        <button class="${k === activeDay ? 'active' : ''}" onclick="switchDay('${k}')">
          ${plan[k].name.split(':')[0]}
        </button>
      `).join('');
      const dateInput = document.getElementById('session-date');
      dateInput.value = sessionDateIso;
      updateDateLabel();
      renderDay();
    }

    function switchDay(key) {
      activeDay = key;
      initTrainNav();
    }

    function onDateChange() {
      const v = document.getElementById('session-date').value;
      sessionDateIso = v || todayIso();
      updateDateLabel();
      (plan[activeDay].exercises || []).forEach((ex, i) => {
        const hint = document.getElementById(`hint_${i}`);
        if (hint) hint.textContent = lastHint(ex.name);
      });
    }

    function updateDateLabel() {
      document.getElementById('date-label').textContent = weekdayLabel(sessionDateIso);
    }

    function getLastPerformance(exerciseName) {
      const previous = getHistory().find(s =>
        s.type !== 'endurance' &&
        s.dayKey === activeDay &&
        sessionIso(s) < sessionDateIso
      );

      if (!previous) return null;

      const found = (previous.exercises || []).find(e => e.name === exerciseName);
      if (!found || !Array.isArray(found.sets)) return null;

      const sets = found.sets
        .filter(s => Number(s.reps) > 0)
        .slice()
        .sort((a, b) => Number(a.set) - Number(b.set));

      if (!sets.length) return null;

      const last = sets[sets.length - 1];
      const unit = exerciseName === 'Klimmzüge am Rack'
        ? 'kg Zusatzgewicht'
        : 'kg';

      return {
        date: previous.date,
        text: `${Number(last.weight) || 0} ${unit} × ${last.reps} Wdh. (Satz ${last.set})`
      };
    }

    function lastHint(exerciseName) {
      const last = getLastPerformance(exerciseName);
      return last
        ? `Letzte gleiche Einheit (${last.date}), letzter Satz: ${last.text}`
        : 'Kein separater Vorwert aus der vorherigen gleichen Einheit vorhanden.';
    }

    function renderDay() {
      const data = plan[activeDay];
      const container = document.getElementById('exercise-list');
      const saveBtn = document.getElementById('save-btn');

      let html = `
        <div style="margin-bottom:12px;">
          <strong>${data.name}</strong><br>
          <small style="color:var(--text-muted)">${data.desc}</small>
        </div>`;

      if (data.type === 'endurance') {
        html += `
          <div class="card">
            <div class="card-title">Geplant</div>
            <ul class="plan-list">
              ${data.items.map(i => `<li>${i}</li>`).join('')}
            </ul>
            <label class="done-box">
              <input type="checkbox" id="done-check">
              <span>Gemacht</span>
            </label>
          </div>`;

        saveBtn.textContent = 'Als erledigt speichern';
      } else {
        data.exercises.forEach((ex, exIdx) => {
          const pullup = ex.name === 'Klimmzüge am Rack';
          const weightLabel = pullup ? 'Zusatzgewicht kg' : 'kg';

          html += `
            <div class="card">
              <div class="card-title">${ex.name}</div>
              <div class="card-subtitle">Ziel: ${ex.target}</div>
              <div class="last-performance" id="hint_${exIdx}">
                ${lastHint(ex.name)}
              </div>
              ${pullup
                ? '<p class="card-subtitle">0 kg = Körpergewicht. Wiederholungen zählen auch ohne Zusatzgewicht.</p>'
                : ''}
              <div class="set-row">
                <span>Satz</span>
                <span>${weightLabel}</span>
                <span>Wdh.</span>
              </div>`;

          for (let s = 1; s <= ex.sets; s++) {
            html += `
              <div class="set-row">
                <span>Satz ${s}</span>
                <input
                  type="number"
                  min="0"
                  step="0.5"
                  inputmode="decimal"
                  placeholder="${pullup ? '0' : 'kg'}"
                  aria-label="${weightLabel}, Satz ${s}"
                  id="input_${activeDay}_${exIdx}_s${s}_w">
                <input
                  type="number"
                  min="0"
                  step="1"
                  inputmode="numeric"
                  placeholder="Wdh"
                  aria-label="Wiederholungen, Satz ${s}"
                  id="input_${activeDay}_${exIdx}_s${s}_r">
              </div>`;
          }

          html += `</div>`;
        });

        saveBtn.textContent = 'Einheit speichern';
      }

      container.innerHTML = html;
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2000);
    }

    function saveWorkoutSession() {
      const data = plan[activeDay];
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      if (data.type === 'endurance') {
        const check = document.getElementById('done-check');

        if (!check || !check.checked) {
          alert('Bitte hake zuerst „Gemacht" an.');
          return;
        }

        history.push({
          id: Date.now(),
          iso: sessionDateIso,
          date: isoToDe(sessionDateIso),
          type: 'endurance',
          dayKey: activeDay,
          dayName: data.name,
          done: true
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        showToast();
        renderDay();
        return;
      }

      const sessionExercises = [];
      let hasData = false;

      data.exercises.forEach((ex, exIdx) => {
        const sets = [];
        let maxWeight = 0;
        let maxEst1RM = 0;

        for (let s = 1; s <= ex.sets; s++) {
          const wInput = document.getElementById(`input_${activeDay}_${exIdx}_s${s}_w`);
          const rInput = document.getElementById(`input_${activeDay}_${exIdx}_s${s}_r`);
          const weight = parseFloat(wInput ? wInput.value : 0) || 0;
          const reps = parseInt(rInput ? rInput.value : 0) || 0;

          if (weight > 0 || reps > 0) {
            hasData = true;
            sets.push({ set: s, weight, reps });

            if (weight > maxWeight) maxWeight = weight;

            const est1RM = reps > 0
              ? weight * (1 + reps / 30)
              : weight;

            if (est1RM > maxEst1RM) {
              maxEst1RM = Math.round(est1RM * 10) / 10;
            }
          }
        }

        if (sets.length > 0) {
          sessionExercises.push({
            name: ex.name,
            sets,
            maxWeight,
            est1RM: maxEst1RM
          });
        }
      });

      if (!hasData) {
        alert('Bitte trage vor dem Speichern mindestens einen Satz ein.');
        return;
      }

      history.push({
        id: Date.now(),
        iso: sessionDateIso,
        date: isoToDe(sessionDateIso),
        type: 'strength',
        dayKey: activeDay,
        dayName: data.name,
        exercises: sessionExercises
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      showToast();
      renderDay();
    }

    function renderHistoryTab() {
      const container = document.getElementById('history-list');
      const history = getHistory();

      if (history.length === 0) {
        container.innerHTML = `
          <p style="color:var(--text-muted); font-size:0.85rem;">
            Noch keine gespeicherten Einheiten vorhanden.
          </p>`;
        return;
      }

      let html = '';

      history.forEach(session => {
        if (session.type === 'endurance') {
          html += `
            <div class="history-entry endurance">
              <h4>${session.date} – ${session.dayName}</h4>
              <ul style="list-style:none; padding-left:0;">
                <li>✓ gemacht</li>
              </ul>
            </div>`;
          return;
        }

        html += `
          <div class="history-entry">
            <h4>${session.date} – ${session.dayName}</h4>
            <ul>`;

        (session.exercises || []).forEach(ex => {
          const setsStr = ex.sets
            .map(s => `${s.weight}kg × ${s.reps}`)
            .join(', ');

          html += `<li><strong>${ex.name}:</strong> ${setsStr}</li>`;
        });

        html += `</ul></div>`;
      });

      container.innerHTML = html;
    }

    function initStatsTab() {
      const select = document.getElementById('exercise-select');
      const allExercises = new Set();

      Object.keys(plan).forEach(k => {
        if (plan[k].type === 'strength') {
          plan[k].exercises.forEach(e => allExercises.add(e.name));
        }
      });

      const currentVal = select.value;

      select.innerHTML = Array.from(allExercises)
        .map(name => `<option value="${name}">${name}</option>`)
        .join('');

      if (currentVal && allExercises.has(currentVal)) {
        select.value = currentVal;
      }

      renderProgressChart();
    }

    function renderProgressChart() {
      const exName = document.getElementById('exercise-select').value;
      const pullup = exName === 'Klimmzüge am Rack';
      const points = [];

      getHistory().slice().reverse().forEach(sess => {
        if (sess.type === 'endurance') return;

        const found = (sess.exercises || []).find(e => e.name === exName);

        const sets = found && Array.isArray(found.sets)
          ? found.sets.filter(s => Number(s.reps) > 0)
          : [];

        if (sets.length) {
          points.push({
            date: sess.date,
            sets
          });
        }
      });

      const canvas = document.getElementById('progressChart');
      const ctx = canvas.getContext('2d');
      const summary = document.getElementById('stats-summary');
      const width = canvas.getBoundingClientRect().width;

      if (width <= 0) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * dpr);
      canvas.height = 220 * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, 220);
      ctx.font = '11px sans-serif';

      if (!points.length) {
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'center';
        ctx.fillText('Noch keine Daten für diese Übung', width / 2, 110);
        summary.textContent = '';
        return;
      }

      let series;

      if (pullup) {
        const loads = [...new Set(
          points.flatMap(p =>
            p.sets.map(s => Number(s.weight) || 0)
          )
        )].sort((a, b) => a - b);

        series = loads.map(load => ({
          label: `${load} kg Zusatzgewicht`,
          values: points.map(p => {
            const matching = p.sets.filter(s =>
              (Number(s.weight) || 0) === load
            );

            return matching.length
              ? Math.max(...matching.map(s => Number(s.reps)))
              : null;
          })
        }));
      } else {
        series = [{
          label: 'Höchstes Gewicht (kg)',
          values: points.map(p =>
            Math.max(...p.sets.map(s => Number(s.weight) || 0))
          )
        }];
      }

      const colors = [
        '#38bdf8',
        '#22c55e',
        '#fbbf24',
        '#c084fc',
        '#fb7185',
        '#2dd4bf'
      ];

      const upper = Math.max(
        1,
        ...series.flatMap(s => s.values.filter(v => v !== null))
      ) * 1.2;

      const x = i => points.length === 1
        ? width / 2
        : 36 + i / (points.length - 1) * (width - 64);

      const y = v => 184 - v / upper * 150;

      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'left';

      ctx.fillText(
        pullup
          ? 'Beste Wiederholungszahl je Zusatzgewicht'
          : 'Höchstes Gewicht (kg)',
        8,
        14
      );

      for (let i = 0; i <= 4; i++) {
        const value = upper * i / 4;

        ctx.strokeStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(32, y(value));
        ctx.lineTo(width - 20, y(value));
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.fillText(String(Math.round(value)), 2, y(value) + 4);
      }

      series.forEach((line, index) => {
        const color = colors[index % colors.length];

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();

        let started = false;

        line.values.forEach((v, i) => {
          if (v === null) {
            started = false;
            return;
          }

          if (started) {
            ctx.lineTo(x(i), y(v));
          } else {
            ctx.moveTo(x(i), y(v));
          }

          started = true;
        });

        ctx.stroke();

        line.values.forEach((v, i) => {
          if (v === null) return;

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x(i), y(v), 4, 0, Math.PI * 2);
          ctx.fill();
        });
      });

      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';

      const stride = Math.max(1, Math.ceil(points.length / 4));

      points.forEach((p, i) => {
        if (i % stride === 0 || i === points.length - 1) {
          ctx.fillText(p.date.slice(0, 5), x(i), 210);
        }
      });

      const latest = points[points.length - 1];

      if (pullup) {
        const legend = series.map((s, i) =>
          `<span style="color:${colors[i % colors.length]}">${s.label}</span>`
        ).join(' · ');

        summary.innerHTML = legend
          + '<br>Letzte Einheit: '
          + latest.sets.map(s =>
            `${Number(s.weight) || 0} kg Zusatzgewicht × ${s.reps} Wdh.`
          ).join(' | ')
          + '<br>Mehr Wiederholungen bei gleichem Zusatzgewicht sind ein Fortschritt. Ein höheres Zusatzgewicht wird separat sichtbar; es wird nicht mit weniger Wiederholungen zu einem einzigen Wert verrechnet.';
      } else {
        const weight = Math.max(
          ...latest.sets.map(s => Number(s.weight) || 0)
        );

        const est = Math.max(
          ...latest.sets.map(s =>
            (Number(s.weight) || 0) * (1 + Number(s.reps) / 30)
          )
        );

        summary.textContent =
          `Letzter Eintrag: ${weight} kg · geschätztes 1RM: ${Math.round(est * 10) / 10} kg (grobe Orientierung, kein Testwert).`;
      }
    }

    function exportData() {
      const history = getHistory();
      const blob = new Blob(
        [JSON.stringify(history, null, 2)],
        { type: 'application/json' }
      );

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.href = url;
      a.download = `trainingsplan_backup_${todayIso()}.json`;
      a.click();

      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);

          if (Array.isArray(parsed)) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            alert('Backup erfolgreich wiederhergestellt!');
            renderHistoryTab();
            initStatsTab();
          } else {
            alert('Ungültiges Dateiformat.');
          }
        } catch (err) {
          alert('Fehler beim Lesen der Datei.');
        }
      };

      reader.readAsText(file);
    }

    initTrainNav();
  </script>
</body>
</html>
